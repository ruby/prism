name: C++ bindings

on:
  push:
    paths: &paths
      - ".github/workflows/cpp-bindings.yml"
      - "include/**"
      - "src/**"
      - "test/cpp/**"
      - "*akefile*"
    branches:
      - main
      - ruby-4.0
  pull_request:
    paths: *paths

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - "g++"
          - "clang++"
        standard:
          - "-std=c++17"
          - "-std=c++20"
        exceptions:
          - ""
          - "-fno-exceptions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Compile prism
        run: bundle exec rake compile
      - name: Compile tests
        run: ${{ matrix.compiler }} ${{ matrix.standard }} ${{ matrix.exceptions }} -Wall -Wextra -pedantic -Werror -o ./cpp_test test/cpp/*_test.cpp build/static/*.o -Iinclude
      - name: Run
        run: ./cpp_test
